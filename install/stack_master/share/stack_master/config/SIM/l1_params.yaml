## L1 Controller Parameters (Lateral Control)
controller:
  ros__parameters:
    # t_clip_min: 0.70
    # t_clip_max: 2.50
    # m_l1: 0.45
    # q_l1: 0.45
    t_clip_min: 0.70
    t_clip_max: 2.50
    m_l1: 0.45
    q_l1: 0.45
    speed_lookahead: 0.15
    lat_err_coeff: 1

    acc_scaler_for_steer: 1.0
    dec_scaler_for_steer: 1.0 

    start_scale_speed: 7.0
    end_scale_speed: 8.0
    downscale_factor: 0.2

    speed_lookahead_for_steer: 0.10 # safe/agg 0/0 # increasing this to 0.20 AT MOST can make the car faster on the laptime but cut more corners


    ## Trailing Controller Parameters
    allow_accel_trailing: False
    trailing_mode: True #True = Distance, False = Time
    prioritize_dyn: True

    trailing_gap: 1.5 # Distance in meters or gap in seconds, depending on mode
    trailing_p_gain: 0.5
    trailing_i_gain: 0.001
    trailing_d_gain: 0.2
    blind_trailing_speed: 1.5